
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Older and Wiser - Guide</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Shared Navbar -->
    <script
      type="module"
      src="/src/components/site-navbar.js"
    ></script>
  </head>

  <body>

    <!-- Start Navbar -->
    <site-navbar></site-navbar>
    <!-- End Navbar -->

    <!-- Guide Content -->
    <main class="container mt-5" style="max-width: 450px">
      <h1>Using Wi-Fi</h1>

      <p class="mt-2">
        <span class="badge rounded-pill text-bg-light border fw-normal">
          <i class="bi bi-eye-fill me-1"></i>
          <span id="viewCount">0</span> views
        </span>
      </p>

      <section id="guide-card" class="card p-4 mt-4">

        <p id="step-counter">Step 1 of 3</p>

        <h2 id="step-title">Open your Wi-Fi settings</h2>

        <div class="text-center my-4">
          <i id="step-icon" class="bi bi-wifi" style="font-size: 80px;"></i>
        </div>

        <p id="step-description">
          Go to your device settings and select the Wi-Fi option.
        </p>

        <div class="d-flex gap-2">
          <button
            id="previous-btn"
            class="btn btn-secondary flex-fill"
          >
            Previous
          </button>

          <button
            id="next-btn"
            class="btn btn-primary flex-fill"
          >
            Next
          </button>
        </div>
      </section>

          <section id="complete-screen" class="card p-4 mt-4 text-center d-none">
          
            <i class="bi bi-check-circle-fill text-success" style="font-size: 80px;"></i>
          
            <h2 class="mt-3">Guide Complete!</h2>
          
            <p class="mt-3">
              Congratulations! You've completed the
              Using Wi-Fi guide.
            </p>
          
            <p class="text-success fw-bold">
              All 3 steps completed!
            </p>
          
            <a href="index.html" class="btn btn-primary mt-3">
              <i class="bi bi-house-door me-2"></i>
              Back to Home
            </a>
          
          </section>

      
    </main>

    <!-- Bootstrap JavaScript (Mobile Hamburger Menu) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Firebase Guide JavaScript -->
    <script type="module" src="/src/guide.js"></script>

  </body>
</html>
