<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Older and Wiser - Bluetooth Guide</title>

        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

        <!-- Shared Navbar -->
        <script type="module" src="/src/components/site-navbar.js">
        </script>
    </head>

    <body>

        <!-- Navbar -->
        <site-navbar></site-navbar>

        <!-- Guide Content -->
        <main class="container mt-5 mb-5" style="max-width: 450px;">

            <h1>Connecting Bluetooth</h1>

            <!-- View Counter -->
            <p class="mt-2">
                <span class="badge rounded-pill text-bg-light border fw-normal">
                    <i class="bi bi-eye-fill me-1"></i>
                    <span id="viewCount">0</span> views
                </span>
            </p>

            <!-- GUIDE STEPS -->
            <section id="guide-card" class="card p-4 mt-4">

                <p id="step-counter">Step 1 of 3</p>

                <h2 id="step-title">Open your Settings App</h2>

                <!-- Step Icon -->
                <div class="text-center my-4">
                    <i id="step-icon" class="bi bi-bluetooth" style="font-size: 80px;"></i>
                </div>

                <!-- Step Description -->
                <p id="step-description">
                    Select the connections option, then tap Bluetooth.
                </p>

                <!-- Navigation Buttons -->
                <div class="d-flex gap-2">

                    <button id="previous-btn" class="btn btn-secondary flex-fill">
                        Previous
                    </button>

                    <button id="next-btn" class="btn btn-primary flex-fill">
                        Next
                    </button>

                </div>

            </section>

            <!-- COMPLETION SCREEN -->
            <section id="complete-screen" class="card p-4 mt-4 text-center d-none">

                <!-- Green Checkmark -->
                <i class="bi bi-check-circle-fill text-success" style="font-size: 80px;"></i>

                <h2 class="mt-3">Guide Complete!</h2>

                <p class="mt-3">
                    Congratulations! You've completed the
                    Connecting Bluetooth guide.
                </p>

                <p class="text-success fw-bold">
                    All 3 steps completed!
                </p>

                <!-- Return Home Button -->
                <a href="index.html" class="btn btn-primary mt-3">
                    <i class="bi bi-house-door me-2"></i>
                    Back to Home
                </a>

            </section>

        </main>

        <!-- Bootstrap JavaScript -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
        </script>

        <!-- Bluetooth Guide JavaScript -->
        <script type="module" src="/src/bluetooth.js"></script>

    </body>

</html>
