<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask for Help - Older and Wiser</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      /* Latest Problems section */
      .latest-problems-section {
        background-color: #eaf4ee;
        padding: 24px;
        border: 1px solid #c8ded0;
        border-radius: 12px;
      }

      .latest-problems-section h2 {
        color: #234d39;
        margin-bottom: 20px;
      }

      /* Problem and solution cards */
      .solution-card {
        background-color: white;
        border: 1px solid #c8ded0;
        border-radius: 10px;
      }

      .solution-card hr {
        border-color: #d4e3d9;
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-success">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html"> Older and Wiser </a>

        <button class="btn btn-outline-light" type="button" id="logout">
          Log out
        </button>
      </div>
    </nav>

    <!-- Ask for Help -->
    <main class="container mt-5" style="max-width: 450px">
      <h1>Ask for Help</h1>

      <h2 class="h4">Describe Your Problem</h2>

      <textarea
        id="problem-description"
        class="form-control"
        rows="5"
        placeholder="Describe your problem"
      ></textarea>

      <label for="problem-image" class="form-label mt-3">
        Upload an Image (Optional)
      </label>

      <input
        type="file"
        class="form-control"
        id="problem-image"
        accept="image/*"
      />

      <button type="button" id="submit-help" class="btn btn-success w-100 mt-3">
        Submit
      </button>
    </main>

    <!-- Leave a Solution -->
    <section class="container mt-4">
      <h2>Leave a Solution</h2>

      <form id="solutionForm">
        <div class="mb-3">
          <label for="solutionProblem" class="form-label"> Problem </label>

          <input
            type="text"
            id="solutionProblem"
            class="form-control"
            placeholder="e.g. issues with Wi-Fi"
            required
          />
        </div>

        <div class="mb-3">
          <label for="solutionText" class="form-label"> Solution </label>

          <textarea
            id="solutionText"
            class="form-control"
            rows="3"
            required
          ></textarea>
        </div>

        <button type="submit" class="btn btn-success">Submit Solution</button>
      </form>
    </section>

    <!-- Latest Problems -->
    <section class="container mt-4 mb-5 latest-problems-section">
      <h2>Latest Problems</h2>

      <div id="problems-go-here"></div>
    </section>

    <!-- Template for Problem and Solution -->
    <template id="reviewTemplate">
      <div class="card solution-card mb-3">
        <div class="card-body">
          <!-- Problem -->
          <h5 class="card-title">
            Problem: <span class="solution-problem"></span>
          </h5>

          <small class="problem-date text-muted"></small>

          <hr />

          <!-- Solution -->
          <h5 class="card-title">
            <span class="text-success">Solution:</span>
            <span class="solution-text"></span>
          </h5>

          <small class="solution-date text-muted"></small>
        </div>
      </div>
    </template>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Ask for Help JavaScript -->
    <script type="module" src="/src/ask-for-help.js"></script>
  </body>
</html>
