
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Older and Wiser - Ask for Help</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <!-- Shared Navbar -->
    <script
      type="module"
      src="/src/components/site-navbar.js"
    ></script>
  </head>

  <body>

    <!-- Start Navbar -->
    <site-navbar></site-navbar>
    <!-- End Navbar -->

    <!-- Ask for Help Form -->
    <main class="container mt-5" style="max-width: 450px;">
      <h1>Ask for Help</h1>
      <h2>Describe Your Problem</h2>

      <!-- Problem Description -->
      <textarea
        id="problem-description"
        class="form-control"
        rows="5"
        placeholder="Describe your problem"
      ></textarea>

      <!-- Image Upload -->
      <div class="mt-3">
        <label for="problem-image" class="form-label">
          Upload an Image (Optional)
        </label>

        <input
          type="file"
          class="form-control"
          id="problem-image"
          accept="image/*"
        >
      </div>

      <!-- Submit Button -->
      <button
        type="button"
        id="submit-help"
        class="btn btn-success w-100 mt-3"
      >
        Submit
      </button>
    </main>

    <!-- Bootstrap JavaScript (Mobile Hamburger Menu) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Firebase WRITE JavaScript -->
    <script type="module" src="/src/ask-for-help.js"></script>

    <!--Soloution-->
    <section class="container mt-4">
        <h2>Leave a Solution</h2>
        <form id="reviewForm" novalidate>
          <div class="mb-3">
            <label for="reviewTitle" class="form-label">Problem </label>
            <input
              type="text"
              id="reviewTitle"
              class="form-control"
              placeholder="e.g. issues with Wi-Fi"
              required
            />
          </div>
          
          <div class="mb-3">
            <label for="reviewText" class="form-label">Solution</label>
            <textarea
              id="reviewText"
              class="form-control"
              rows="3"
              required
            ></textarea>
          </div>
          <button type="submit" class="btn btn-success">Submit Solution</button>
        </form>
      </section>

      <section class="container mt-4 card shadow-sm bg-light">
        <h2>Latest Problems</h2>
        <div id="reviews-go-here"></div>
      </section>

      <template id="reviewTemplate">
        <div class="card mb-2">
          <div class="card-body">
            <h5 class="card-title review-title"></h5>
            <h6 class="card-subtitle mb-2 text-muted review-meta"></h6>
            <p class="card-text review-text"></p>
          </div>
        </div>
      </template>
    </main>


  </body>
</html>
