<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Older and Wiser - Ask for Help</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Shared Navbar -->
    <script type="module" src="/src/components/site-navbar.js"></script>
  </head>

  <body>

    <!-- Navbar -->
    <site-navbar></site-navbar>

    <!-- Ask for Help Form -->
    <main class="container mt-5" style="max-width: 650px;">

      <h1>Ask for Help</h1>
      <h2 class="fs-4 mt-4">Describe Your Problem</h2>

      <!-- Problem Description -->
      <textarea id="problem-description" class="form-control" rows="5" placeholder="Describe your problem"></textarea>

      <!-- Image Upload -->
      <div class="mt-3">
        <label for="problem-image" class="form-label">
          Upload an Image (Optional)
        </label>

        <input type="file" class="form-control" id="problem-image" accept="image/*">
        <small class="text-muted">
          Image uploading is not connected yet.
        </small>
      </div>

      <!-- Submit Problem Button -->
      <button type="button" id="submit-help" class="btn btn-success w-100 mt-3">
        Submit Problem
      </button>

    </main>

    <!-- Leave a Solution Form -->
    <section class="container mt-5" style="max-width: 650px;">

      <h2>Leave a Solution</h2>

      <form id="reviewForm">

        <!-- Problem Title -->
        <div class="mb-3">
          <label for="reviewTitle" class="form-label">
            Problem
          </label>

          <input type="text" id="reviewTitle" class="form-control" placeholder="e.g. Issues with Wi-Fi" required>
        </div>

        <!-- Solution Text -->
        <div class="mb-3">
          <label for="reviewText" class="form-label">
            Solution
          </label>

          <textarea id="reviewText" class="form-control" rows="3" placeholder="Describe how to solve the problem"
            required></textarea>
        </div>

        <!-- Submit Solution Button -->
        <button type="submit" class="btn btn-success">
          Submit Solution
        </button>

      </form>
    </section>

    <!-- Latest Problems -->
    <section class="container mt-5" style="max-width: 650px;">

      <div class="card shadow-sm bg-light">
        <div class="card-body">

          <h2>Latest Problems</h2>

          <div id="reviews-go-here">
            <p class="text-muted">Loading problems...</p>
          </div>

        </div>
      </div>

    </section>

    <!-- Recent Solutions -->
    <section class="container mt-4 mb-5" style="max-width: 650px;">

      <div class="card shadow-sm bg-light">
        <div class="card-body">

          <h2>Recent Solutions</h2>

          <div id="solutions-go-here">
            <p class="text-muted">Loading solutions...</p>
          </div>

        </div>
      </div>

    </section>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase JavaScript -->
    <script type="module" src="/src/ask-for-help.js"></script>

  </body>

</html>
