
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Older and Wiser - Ask for Help</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
  </head>

  <body>
    <main class="container mt-5" style="max-width: 450px;">
      <h1>Ask for Help</h1>
      <h2>Describe Your Problem</h2>

      <!-- Problem Description -->
      <textarea
        id="problem-description"
        class="form-control"
        rows="5"
        placeholder="Describe your problem"
      ></textarea>

      <!-- Image Upload -->
      <div class="mt-3">
        <label for="problem-image" class="form-label">
          Upload an Image (Optional)
        </label>

        <input
          type="file"
          class="form-control"
          id="problem-image"
          accept="image/*"
        >
      </div>

      <!-- Submit Button -->
      <button
        type="button"
        id="submit-help"
        class="btn btn-success w-100 mt-3"
      >
        Submit
      </button>
    </main>

    <!-- Firebase WRITE JavaScript -->
    <script type="module" src="/src/ask-for-help.js"></script>
  </body>
</html>
