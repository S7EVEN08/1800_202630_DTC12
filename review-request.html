
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Review Request - Older and Wiser</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <!-- Custom background colour -->
    <style>
      .bg-soft-green {
        background-color: #c8ded0;
      }
    </style>
  </head>

  <body class="bg-light">
    <!-- Start Navbar -->
    <site-navbar></site-navbar>
    <!-- End Navbar -->

    <!-- Review Request -->
    <main class="container py-4">

      <!-- Back button and page title -->
      <div class="d-flex align-items-center mb-4">
        <a
          href="contact-method.html"
          id="backButton"
          class="btn btn-outline-secondary me-3"
          aria-label="Go back"
        >
          <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="fs-3 fw-bold mb-0">Review Request</h1>
      </div>

      <!-- Request information -->
      <section class="card border-0 shadow-sm mb-4">
        <div class="card-body p-4">

          <!-- Problem description -->
          <h2 class="fs-5 fw-bold">Problem:</h2>

          <p id="reviewDescription" class="bg-soft-green p-3 rounded">
            Your problem description will appear here.
          </p>

          <!-- Uploaded photo -->
          <h2 class="fs-5 fw-bold mt-4">Photo:</h2>

          <div class="bg-soft-green rounded p-3 text-center">
            <img
              id="reviewPhoto"
              alt="Uploaded problem photo"
              class="img-fluid rounded d-none"
              style="max-height: 200px"
            />

            <p id="noPhoto" class="text-muted mb-0">
              No photo uploaded.
            </p>
          </div>

          <!-- Contact method -->
          <h2 class="fs-5 fw-bold mt-4">Contact method:</h2>

          <p id="reviewContactMethod" class="bg-soft-green p-3 rounded mb-0">
            Your selected contact method will appear here.
          </p>

        </div>
      </section>

      <!-- Submit request -->
      <button
        type="button"
        id="submitRequestButton"
        class="btn btn-success btn-lg w-100 fw-bold"
      >
        Submit Request
      </button>

    </main>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Review Request JavaScript -->
    <script type="module" src="/src/review-request.js"></script>

  </body>
</html>
